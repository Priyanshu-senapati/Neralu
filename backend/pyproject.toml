[project]
name = "neralu-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "twilio>=9.0",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools]
packages = ["app", "app.routes", "seed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
